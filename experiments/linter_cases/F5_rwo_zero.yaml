apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  labels: {app: payment}
spec:
  replicas: 0
  selector:
    matchLabels: {app: payment}
  template:
    metadata:
      labels: {app: payment}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
      - name: payment
        image: registry.example.com/payment-processor:2.1.0
        imagePullPolicy: Always
        securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        ports:
        - containerPort: 8080
        readinessProbe: {httpGet: {path: /healthz, port: 8080}}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}}
        volumeMounts:
        - {name: data, mountPath: /var/lib/payment}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: payment-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: ClusterIP
  selector: {app: payment}
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
